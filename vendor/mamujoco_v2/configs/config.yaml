




common:
  seed: 0
  device: cuda                        # cpu / cuda / cuda:0
  num_threads: 1

  env: {}

  network:
    hidden_dim: 128
    use_gru: false
    use_agent_id: true

  sigma:
    parameterization: sigmoid         # sigmoid：σ ∈ [minimum, maximum]；exp：σ = floor + exp(raw)
    initial: 0.45
    minimum: 0.1
    maximum: 0.5
    floor: 0.0
    state_dependent: false

  normalization:
    observations: true
    observation_clip: 10.0
    rewards: true
    returns: true

  training:
    total_env_steps: 10000000
    epochs: 5
    minibatch_size: 4000
    bptt_steps: null
    gamma: 0.99
    gae_lambda: 0.95
    gae_value: online
    target_tau: 0.01
    normalize_advantages: true
    clip_ratio: 0.1
    log_ratio_clip: 3.0
    entropy_coef: 0.0
    grad_norm_clip: 10.0
    actor_lr: 0.0005
    critic_lr: 0.0005
    optimizer_eps: 1.0e-8
    critic_minibatches: 1
    batch_steps: 0

  evaluation:
    interval: 50000
    episodes: 16
    sample_flow_noise: false
    sample_action_noise: false

  output:
    directory: results
    experiment: null                  # null = <scenario>_<agent_conf>
    log_interval: 10000
    checkpoint_interval: 2500000

# ============================== MAPPO ==============================

mappo:
  action_squash: sigmoid

# ============================== HAPPO ==============================

happo:
  fixed_order: false

# ============================== MAT ==============================

mat:
  layers: 1
  attention_heads: 4
